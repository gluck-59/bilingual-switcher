name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      # We pin actions to readable version tags (e.g. @v6), not commit SHAs, so
      # exclude the mutable-action-tag rule. Every other security rule stays blocking.
      - run: semgrep scan --config p/swift --config p/secrets --config p/owasp-top-ten --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag --error

  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download Sparkle
        run: make setup

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::CERT_P12 secret not set — build will be ad-hoc signed"
            exit 0
          fi
          if [ -z "$CERT_P12_PASSWORD" ]; then
            echo "::warning::CERT_P12_PASSWORD secret not set — build will be ad-hoc signed"
            exit 0
          fi
          P12_B64=$(printf '%s' "$CERT_P12" | tr -d '[:space:]')
          P12_PASS=$(printf '%s' "$CERT_P12_PASSWORD" | tr -d '[:space:]')
          echo "$P12_B64" | base64 --decode > /tmp/cert.p12
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=buildkeychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f /tmp/cert.p12

      - name: Build
        run: make

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: BilingualSwitcher.app
          path: build/BilingualSwitcher.app

  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Enable Russian keyboard layout
        run: |
          # Add Russian keyboard layout so conversion tests can run
          defaults write com.apple.HIToolbox AppleEnabledInputSources -array-add \
            '{ "Bundle ID" = "com.apple.inputmethod.EmojiFunctionRowItem"; InputSourceKind = "Non Keyboard Input Method"; }' \
            '{ "InputSourceKind" = "Keyboard Layout"; "KeyboardLayout ID" = 19456; "KeyboardLayout Name" = "Russian"; }'

      - name: Download Sparkle
        run: make setup

      - name: Run tests
        run: make test

  test-asan:
    name: Test (AddressSanitizer)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Enable Russian keyboard layout
        run: |
          defaults write com.apple.HIToolbox AppleEnabledInputSources -array-add \
            '{ "InputSourceKind" = "Keyboard Layout"; "KeyboardLayout ID" = 19456; "KeyboardLayout Name" = "Russian"; }'

      - name: Download Sparkle
        run: make setup

      - name: Run tests with ASan
        run: make test-asan
